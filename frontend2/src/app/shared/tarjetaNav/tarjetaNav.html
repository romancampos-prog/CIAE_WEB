
<div class="home-card" [class.home-card--disabled]="deshabilitado" (click)="onClick()">
  <div class="hc-header" [class]="'hc-header--' + color">
    <div class="hc-icon-box" [class]="'hc-icon-box--' + color">
      <ng-content></ng-content>
    </div>
    <div class="hc-header-text">
      <p class="hc-eyebrow">{{ antetitulo }}</p>
      <h2 class="hc-name">{{ titulo }}</h2>
    </div>
  </div>

  <p class="hc-desc">{{ descripcion }}</p>

  <div class="hc-footer">
    <div class="hc-chips">
      @for (etiqueta of etiquetas; track etiqueta) {
        <span class="hc-chip" [class]="'hc-chip--' + (deshabilitado ? 'muted' : color)">{{ etiqueta }}</span>
      }
      @if (deshabilitado) {
        <span class="hc-chip hc-chip--muted">{{ mensajeDeshabilitado }}</span>
      }
    </div>
    <div class="hc-arrow" [class]="'hc-arrow--' + (deshabilitado ? 'disabled' : color === 'tinto' ? 'tinto' : 'green')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </div>
  </div>
</div>
