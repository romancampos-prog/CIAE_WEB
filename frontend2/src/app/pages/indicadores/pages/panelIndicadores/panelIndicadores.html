<div class="panel-root">

  <div class="panel-bg" aria-hidden="true">
    <div class="panel-circle panel-c1"></div>
    <div class="panel-circle panel-c2"></div>
    <div class="panel-grid"></div>
  </div>

  <main class="panel-main">

    <div class="panel-hero">
      <h1 class="panel-title">Indicadores Médicos</h1>
      <p class="panel-sub">¿Qué deseas hacer?</p>
    </div>

    <div class="panel-cards">

      <app-tarjeta-nav
        titulo="Seguimiento de Indicadores"
        antetitulo="Consulta"
        descripcion="Identifica tendencias de cumplimiento y resultados por unidad médica conforme al MMIM."
        [etiquetas]="['Tendencias', 'Cumplimiento']"
        color="green"
        (activar)="irAGraficas()"
      >
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
      </app-tarjeta-nav>

      <app-tarjeta-nav
        titulo="Generar indicadores"
        antetitulo="Generación"
        descripcion="Produce los reportes de indicadores médicos para evaluación del desempeño por unidad conforme al MMIM."
        [etiquetas]="['Reportes', 'Excel']"
        color="gold"
      >
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </app-tarjeta-nav>

    </div>
  </main>
</div>
